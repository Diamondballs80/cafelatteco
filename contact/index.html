<!doctype html>

<head>

  <link rel="icon" type="image/png" href="../assets/images/cafeLatte_logo_glyph.png">
  <link rel="stylesheet" href="../assets/css/styles.css">

    window.__BASE_PATH__ = "../";

  <header data-nav></header>

              <div class="contact-hero__label">Press</div>
              <a href="mailto:press@cafelatteco.com">press@cafelatteco.com</a>
            </div>
          </div>
        </div>

          <img src="../assets/images/jos2.webp" alt="Cafe Latte Co. iced coffee assortment">
